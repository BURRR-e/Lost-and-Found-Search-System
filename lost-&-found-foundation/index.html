<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found | Home</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/navigation.css">
    <link rel="stylesheet" href="/style/index.css">
    
</head>
<body>

    <nav>
        <div class="head">
            <img src="/assets/logo.png" alt="Logo" class="logo">
            <h2>Lost and Found</h2>
            <i class="fa-solid fa-bars" id="navMenu"></i>
        </div>
    </nav>
    <div class="snap">
        <div class="front-page">
            <div class="headings">
                <h1>Welcome to Lost and Found</h1>
                <p>
                    A school platform where students and staff can
                    report, find, and claim lost belongings.
                </p>
                <div class="btn">
                    <button type="button">Log in</button>
                    <button type="button">Sign up</button>
                </div>
            </div>

            <div class="image">

            </div>
        </div>

        <div class="pages">
            <h3>HOW IT WORKS?</h3>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 School Lost and Found System</p>
    </footer>
    
    <script src="/script/navigation.js"></script>
    <script src="/script/report.js"></script>
</body>
</html>
