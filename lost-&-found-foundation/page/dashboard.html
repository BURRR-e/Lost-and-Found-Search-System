<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found | Dashboard</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/navigation.css">
    <link rel="stylesheet" href="/style/display.css">
    
</head>
<body>

    <nav>
        <div class="head">
            <img src="/assets/logo.png" alt="Logo" class="logo">
            <h2>Lost and Found</h2>
            <i class="fa-solid fa-bars" id="navMenu"></i>
        </div>
        
        <div class="nav-links">
            <a href="../home.html">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            
            <a href="dashboard.html">
                <i class="fa-solid fa-table-columns"></i>
                <span>Dashboard</span>
            </a>
            
            <a href="report.html">
                <i class="fa-solid fa-file-lines"></i>
                <span>Report Item</span>
            </a>
            
            <a href="claims.html">
                <i class="fa-solid fa-hand-holding"></i>
                <span>My Claims</span>
            </a>
            
            <a href="contact.html">
                <i class="fa-solid fa-headset"></i>
                <span>Contact</span>
            </a>
            
            <a href="account.html">
                <i class="fa-solid fa-user"></i>
                <span>Account</span>
            </a>
        </div>
    </nav>

    <div>
        <h1>Item Dashboard</h1>
        <p>Browse reported lost and found belongings.</p>
    </div>

    <div>
        <h2>Search and Filter</h2>

        <form class="search">
            <div>
                <label for="search">Search Item</label><br>
                <input type="text" id="search" name="search"
                    placeholder="Enter item name">
            </div>

            <div>
                <label for="category">Category</label><br>
                <select id="category" name="category">
                    <option value="">All Categories</option>
                    <option value="school-supplies">School Supplies</option>
                    <option value="electronics">Electronics</option>
                    <option value="personal">Personal Belongings</option>
                    <option value="clothing">Clothing</option>
                    <option value="others">Others</option>
                </select>
            </div>

            <div>
                <label for="status">Item Status</label><br>
                <select id="status" name="status">
                    <option value="">All Items</option>
                    <option value="lost">Lost</option>
                    <option value="found">Found</option>
                    <option value="claimed">Claimed</option>
                    <option value="returned">Returned</option>
                </select>
            </div>

            <button type="submit">Search</button>
            <button type="reset">Clear</button>
        </form>
    </div>

    <div>
        <h2>Reported Items</h2>
        <div id="confirm-report">
            
        </div>
        
    </div>

    <footer>
        <p>&copy; 2026 School Lost and Found System</p>
    </footer>
    
    <script src="/script/navigation.js"></script>
    <script src="/script/dashboard.js"></script>

</body>
</html>
