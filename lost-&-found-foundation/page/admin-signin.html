<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost and Found Admin Sign in</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/signin.css">
  <link rel="stylesheet" href="/style/navigation.css">
</head>

<body>
  <div class="head">
    <img src="/assets/logo.png" alt="Lost and Found logo" class="logo">
    <h2>Lost and Found</h2>
  </div>

  <div class="whole">
    <div class="greet">
      <h1>Admin sign in</h1>
      <p>Staff access only. Sign in with your admin account.</p>
    </div>

    <form id="questions" data-admin="true">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required>

      <button type="submit" id="submit">Sign in</button>
    </form>

    <p class="signup-link">Need an admin account? <a href="/page/admin-signup.html">Admin sign up</a></p>
    <p class="signup-link"><a href="/page/signin.html">Back to user sign in</a></p>
  </div>

  <p id="footer">© 2026 School Lost and Found System</p>

  <script src="/script/signin.js"></script>
</body>

</html>
