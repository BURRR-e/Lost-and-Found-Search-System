<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found | Report Item</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/navigation.css">
    <link rel="stylesheet" href="/style/category.css">
    
</head>
<body>
    
    <nav>
        <div class="head">
            <img src="/assets/logo.png" alt="Logo" class="logo">
            <h2>Lost and Found</h2>
            <i class="fa-solid fa-bars" id="navMenu"></i>
        </div>
        
        <div class="nav-links">
            <a href="home.html">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            
            <a href="dashboard.html">
                <i class="fa-solid fa-table-columns"></i>
                <span>Dashboard</span>
            </a>
            
            <a href="report.html">
                <i class="fa-solid fa-file-lines"></i>
                <span>Report Item</span>
            </a>
            
            <a href="claims.html">
                <i class="fa-solid fa-hand-holding"></i>
                <span>My Claims</span>
            </a>
            
            <a href="contact.html">
                <i class="fa-solid fa-headset"></i>
                <span>Contact</span>
            </a>
            
            <a href="account.html">
                <i class="fa-solid fa-user"></i>
                <span>Account</span>
            </a>
        </div>
    </nav>

    <div>
        <h1>Report an Item</h1>
        <p>Submit a report for a lost or found belonging.</p>
    </div>

    <div>
        <h2>Item Information</h2>

        <form id="report">
            <div>
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" name="item-name"
                    placeholder="Enter item name" required>
            </div>

            <div>
                <label for="item-category">Category</label>
                <select id="item-category" name="item-category" required>
                    <option value="">Select Category</option>
                    <option value="school-supplies">School Supplies</option>
                    <option value="electronics">Electronics</option>
                    <option value="personal-belongings">Personal Belongings</option>
                    <option value="clothing">Clothing</option>
                    <option value="others">Others</option>
                </select>
            </div>

            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description"
                    placeholder="Describe the item" required></textarea>
            </div>

            <div>
                <label for="date">Date Lost or Found</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div>
                <label for="location">Location</label>
                <input type="text" id="location" name="location"
                    placeholder="Where was it lost or found?" required>
            </div>

            <div>
                <label for="photo">Item Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <button type="submit">Submit Report</button>
            <button type="reset">Clear Form</button>
        </form>
    </div>
    
    <div id="confirmation" hidden>
        
    </div>

    <footer>
        <p>&copy; 2026 School Lost and Found System</p>
    </footer>
    
    <script src="/script/navigation.js"></script>
    <script src="/script/report.js"></script>

</body>
</html>
