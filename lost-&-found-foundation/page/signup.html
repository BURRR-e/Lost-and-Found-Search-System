<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost and Found Sign up</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/style/style.css">
  <link rel="stylesheet" href="/style/signin.css">
  <link rel="stylesheet" href="/style/navigation.css">
</head>

<body>
  <div class="head">
    <img src="/assets/logo.png" alt="Lost and Found logo" class="logo">
    <h2>Lost and Found</h2>
  </div>

  <div class="whole">
    <div class="greet">
      <h1>Sign up</h1>
      <p>Welcome! Please create your account.</p>
    </div>

    <form id="questions">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="schoolid">School ID</label>
      <input type="text" id="schoolid" name="schoolid" placeholder="Enter your school ID" required>

      <label for="role">Role</label>
      <select id="role" name="role" required>
        <option value="student">Student</option>
        <option value="professor">Professor</option>
        <option value="staff">Staff</option>
      </select>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter your password" required>

      <button type="submit" id="submit">Sign up</button>
    </form>

    <p class="signup-link">Already have an account? <a href="/page/signin.html">Sign in</a></p>
  </div>

  <p id="footer">© 2026 School Lost and Found System</p>

  <script src="/script/signup.js"></script>
</body>

</html>
