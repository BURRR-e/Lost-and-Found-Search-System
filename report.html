<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost and Found | Report Item</title>
    
    <link rel="stylesheet" href="/style/style.css">
</head>
<body>

    <nav>
        <div>
            <h2>Lost and Found</h2>
        </div>

        <div>
            <a href="../index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="report.html">Report Item</a>
            <a href="claims.html">My Claims</a>
            <a href="contact.html">Contact</a>
            <a href="account.html">Account</a>
            <a href="admin.html">Admin Panel</a>
        </div>
    </nav>

    <div>
        <h1>Report an Item</h1>
        <p>Submit a report for a lost or found belonging.</p>
    </div>

    <div>
        <h2>Item Information</h2>

        <form>
            <div>
                <label for="report-type">Report Type</label>
                <select id="report-type" name="report-type" required>
                    <option value="">Select Report Type</option>
                    <option value="lost">I Lost an Item</option>
                    <option value="found">I Found an Item</option>
                </select>
            </div>

            <div>
                <label for="item-name">Item Name</label>
                <input type="text" id="item-name" name="item-name"
                    placeholder="Enter item name" required>
            </div>

            <div>
                <label for="item-category">Category</label>
                <select id="item-category" name="item-category" required>
                    <option value="">Select Category</option>
                    <option value="school-supplies">School Supplies</option>
                    <option value="electronics">Electronics</option>
                    <option value="personal">Personal Belongings</option>
                    <option value="clothing">Clothing</option>
                    <option value="others">Others</option>
                </select>
            </div>

            <div>
                <label for="description">Description</label>
                <textarea id="description" name="description"
                    placeholder="Describe the item" required></textarea>
            </div>

            <div>
                <label for="date">Date Lost or Found</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div>
                <label for="location">Location</label>
                <input type="text" id="location" name="location"
                    placeholder="Where was it lost or found?" required>
            </div>

            <div>
                <label for="photo">Item Photo</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </div>

            <div>
                <label for="reporter">Reporter Name</label>
                <input type="text" id="reporter" name="reporter"
                    placeholder="Enter your name" required>
            </div>

            <button type="submit">Submit Report</button>
            <button type="reset">Clear Form</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 School Lost and Found System</p>
    </footer>

</body>
</html>
